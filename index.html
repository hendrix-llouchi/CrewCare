<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="Canvas">
    <meta name="description" content="An offline-first health companion for crews.">
    <title>CrewCare</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#/crew">
          <img class="brand__icon" src="./favicon.ico" width="32" height="32" alt="">
          <span>CrewCare</span>
        </a>
        <p class="offline-note" id="offline-note" role="status" hidden>
          Offline: saving on this device
        </p>
      </div>
    </header>

    <main id="app" aria-live="polite" aria-atomic="true">
      <p class="app-loading" role="status">Loading crew dashboard…</p>
      <noscript><p class="app-loading__error">CrewCare needs JavaScript enabled to show the dashboard.</p></noscript>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <a class="bottom-nav__link" href="#/crew" data-nav="crew">
        <span data-icon="crew" aria-hidden="true"></span>
        <span>Crew</span>
      </a>
      <a class="bottom-nav__link" href="#/checkin" data-nav="checkin">
        <span data-icon="check" aria-hidden="true"></span>
        <span>Check-in</span>
      </a>
      <a class="bottom-nav__link" href="#/emergency" data-nav="emergency">
        <span data-icon="emergency" aria-hidden="true"></span>
        <span>Emergency</span>
      </a>
      <a class="bottom-nav__link" href="#/more" data-nav="more">
        <span data-icon="more" aria-hidden="true"></span>
        <span>More</span>
      </a>
    </nav>

    <footer class="site-footer">
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
    </footer>

    <script src="./icons.js"></script>
    <script src="./data.js"></script>
    <script src="./trends.js"></script>
    <script src="./store.js"></script>
    <script src="./queue.js"></script>
    <script src="./triage.js"></script>
    <script src="./guidance.js"></script>
    <script src="./adapter.js"></script>
    <script src="./stubs.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
